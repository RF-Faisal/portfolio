name: Localize achievement images

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/localize-achievement-images.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download article images and update page
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re
          import urllib.request

          jobs = [
              {
                  "article": "https://www.thedailystar.net/star-youth/news/robot-built-mist-students-brings-glory-bangladesh-2061577",
                  "fallbacks": [
                      "https://online.thedailystar.net/sites/default/files/styles/big_1/public/feature/images/2021/03/16/mist.jpg",
                      "https://online-d11.thedailystar.net/sites/default/files/styles/big_1/public/feature/images/2021/03/16/mist.jpg",
                  ],
                  "output": "assets/images/achievements/uvc-purge.jpg",
                  "needle": "mist.jpg",
              },
              {
                  "article": "https://www.thedailystar.net/star-youth/news/mists-mongol-barota-tops-the-prestigious-university-rover-challenge-2021-bracu-ranks-4th-2107697",
                  "fallbacks": [
                      "https://www.thedailystar.net/sites/default/files/styles/big_1/public/feature/images/2021/06/09/mongol_barota_.jpg",
                      "https://online.thedailystar.net/sites/default/files/styles/big_1/public/feature/images/2021/06/09/mongol_barota_.jpg",
                  ],
                  "output": "assets/images/achievements/urc-2021.jpg",
                  "needle": "mongol_barota_",
              },
          ]

          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36"

          def get(url, referer=None):
              headers = {"User-Agent": ua, "Accept": "*/*"}
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), r.headers.get_content_type(), r.geturl()

          def image_candidates(page_text, needle):
              candidates = []
              patterns = [
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
                  r'<meta[^>]+name=["\']twitter:image(?::src)?["\'][^>]+content=["\']([^"\']+)["\']',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image(?::src)?["\']',
                  r'<img[^>]+src=["\']([^"\']+)["\'][^>]*>',
              ]
              for pattern in patterns:
                  for m in re.finditer(pattern, page_text, flags=re.I):
                      url = html.unescape(m.group(1))
                      if url.startswith("//"):
                          url = "https:" + url
                      if url.startswith("http"):
                          candidates.append(url)
              preferred = [u for u in candidates if needle.lower() in u.lower()]
              return preferred + [u for u in candidates if u not in preferred]

          for job in jobs:
              page_bytes, _, final_article = get(job["article"])
              page_text = page_bytes.decode("utf-8", errors="ignore")
              candidates = image_candidates(page_text, job["needle"]) + job["fallbacks"]

              seen = set()
              last_error = None
              for image_url in candidates:
                  if image_url in seen:
                      continue
                  seen.add(image_url)
                  try:
                      data, ctype, final_url = get(image_url, final_article)
                      if len(data) < 10000:
                          raise RuntimeError(f"Downloaded file too small: {len(data)} bytes")
                      if ctype not in {"image/jpeg", "image/jpg", "image/png", "image/webp"}:
                          raise RuntimeError(f"Unexpected content type: {ctype}")
                      Path(job["output"]).parent.mkdir(parents=True, exist_ok=True)
                      Path(job["output"]).write_bytes(data)
                      print(f"Saved {job['output']} from {final_url} ({ctype}, {len(data)} bytes)")
                      break
                  except Exception as exc:
                      last_error = exc
              else:
                  raise RuntimeError(f"Could not download image for {job['article']}: {last_error}")

          page = Path("achievements/index.html")
          text = page.read_text(encoding="utf-8")
          text = re.sub(
              r'<img src="https://[^"]*/feature/images/2021/03/16/mist\.jpg"',
              '<img src="../assets/images/achievements/uvc-purge.jpg"',
              text,
          )
          text = re.sub(
              r'<img src="https://[^"]*/feature/images/2021/06/09/mongol_barota_\.jpg"',
              '<img src="../assets/images/achievements/urc-2021.jpg"',
              text,
          )
          page.write_text(text, encoding="utf-8")

          Path(".github/workflows/localize-achievement-images.yml").unlink()
          PY

      - name: Commit localized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements/index.html assets/images/achievements/uvc-purge.jpg assets/images/achievements/urc-2021.jpg .github/workflows/localize-achievement-images.yml
          git commit -m "Localize achievement images"
          git push
